<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVS Admin</title><style>body{font-family:system-ui;background:#f4f8f6;color:#17322b}.w{width:min(1100px,94%);margin:auto}.box{background:white;padding:20px;border-radius:18px;margin:20px 0;overflow:auto}button{padding:8px;border:0;border-radius:8px;background:#0b6b55;color:white;cursor:pointer}.red{background:#b52b2b}table{border-collapse:collapse;width:100%;min-width:700px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><div class="w"><h1>HVS Admin</h1><div class="box"><input id="k" type="password" placeholder="ADMIN_KEY"><button onclick="load()">Open</button></div><div id="out"></div></div><script>let K="";async function api(u,o={}){o.headers={...(o.headers||{}),"x-admin-key":K};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){K=k.value;try{let[b,r]=await Promise.all([api("/api/admin/bookings"),api("/api/admin/reviews")]);out.innerHTML='<div class="box"><h2>Bookings</h2><table><tr><th>Customer</th><th>Visit</th><th>Location</th><th>Status</th></tr>'+b.map(x=>`<tr><td>${x.name}<br>${x.phone}<br>${x.pet}</td><td>${x.service}<br>${x.date} ${x.time}<br>${x.notes||""}</td><td>${x.lat?`<a target="_blank" href="https://www.google.com/maps?q=${x.lat},${x.lng}">Open GPS</a>`:""}<br>${x.address||""}</td><td><select onchange="st(${x.id},this.value)"><option>new</option><option>confirmed</option><option>completed</option><option>cancelled</option></select></td></tr>`).join("")+'</table></div><div class="box"><h2>Reviews</h2><table><tr><th>Customer</th><th>Rating</th><th>Review</th><th>Action</th></tr>'+r.map(x=>`<tr><td>${x.name}<br>${x.pet}</td><td>${"★".repeat(x.rating)}</td><td>${x.review}</td><td>${x.approved?'<button class="red" onclick="ap('+x.id+',0)">Hide</button>':'<button onclick="ap('+x.id+',1)">Approve</button>'} <button class="red" onclick="delr(${x.id})">Delete</button></td></tr>`).join("")+'</table></div>'}catch(e){alert(e.message)}}async function ap(id,a){await api("/api/admin/reviews/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({approved:a})});load()}async function delr(id){if(confirm("Delete?")){await api("/api/admin/reviews/"+id,{method:"DELETE"});load()}}async function st(id,s){await api("/api/admin/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})})}</script></body></html>
